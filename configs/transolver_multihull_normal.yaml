# Transolver：4 船型训练 / 2 船型验证的多船型数据集（normal 网格）
# 训练集 kcs_fr026_normal_mesh, dtc_fr022_normal_mesh, series60_fr022_normal_mesh, containership_fr022_normal_mesh
# 验证集 s175_fr029_normal_mesh, kvlcc2_fr014_normal_mesh
stats: dataset/stats.json
model_type: transolver
model:
  d_model: 208
  nhead: 8
  layers: 3
  slices: 32
  mlp_ratio: 3
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  - 2
  epochs: 100
  steps_per_epoch: 48
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh
