# APP 分词 + OFormer 主干：KCS Fr=0.26 normal 网格条目既作训练集也作验证集（1.23 M 参数）
# 与 OFormer 基线只差分词方式（逐点 → APP patch token），参数量与训练超参与之一致，
# 用来验证分词器即插即用。
stats: dataset/shipbench/stats.json
model_type: appsolver_oformer
model:
  flow_size_tiers: [[0.05, 0.02], [0.2, 0.05], [null, 0.15]]
  hull_size: 0.05
  d_model: 128
  nhead: 8
  encoder_layers: 2
  decoder_layers: 2
  mlp_ratio: 4
  propagator_layers: 3
  fourier_scale: 8.0
  rotary_min_freq: 0.25
  rotary_scale: 16.0
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries: [kcs_fr026_normal_mesh]
  train_strides: [1, 2]
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
