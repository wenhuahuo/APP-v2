# gino：等计算量（iso-FLOPs）对照，前向 211.8 GFLOPs、1.216 M 参数
# 主实验统一口径：自由液面 + 船体表面输入、仅流场输出、逐层 FiLM、
# lambda_hull=0.0
# 与 gino_multihull_normal.yaml 的唯一差别是主干容量
# （gno_kernel_hidden 64 → 216），分词/潜网格与训练协议不变
stats: dataset/shipbench/stats.json
model_type: gino
model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  latent_shape:
  - 32
  - 16
  - 8
  n_modes:
  - 8
  - 4
  - 2
  hidden_channels: 72
  fno_layers: 3
  embed_channels: 32
  gno_embed_channels: 24
  gno_kernel_hidden: 216
  in_radius: 0.03
  out_radius: 0.09
  gno_chunk: 4096
  lifting_channels: 128
  projection_channels: 128
  expansion: 0.5
  conditioning: film
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 0.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh

eval:
  strides:
  - 1
