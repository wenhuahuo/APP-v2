# gnot：等计算量（iso-FLOPs）对照，前向 210.9 GFLOPs、0.851 M 参数
# 主实验统一口径：自由液面 + 船体表面输入、仅流场输出、逐层 FiLM、
# lambda_hull=0.0
# 与 gnot_multihull_normal.yaml 的唯一差别是主干容量
# （d_model 108 → 88），分词/潜网格与训练协议不变
stats: dataset/shipbench/stats.json
model_type: gnot
model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  conditioning: film
  d_model: 88
  nhead: 4
  layers: 2
  mlp_ratio: 3
  n_experts: 3
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  - 2
  epochs: 100
  steps_per_epoch: 48
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 0.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh
