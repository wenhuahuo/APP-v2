# gnot：等计算量（iso-FLOPs）对照，前向 250.9 GFLOPs、1.010 M 参数
# KCS 单船型 6 个 Fr，训练 kcs_fr026/031/036/047/052_normal_mesh，验证 kcs_fr042（Fr=0.416）
# 与 gnot_kcs_fr_sweep 的唯一差别是容量超参（对齐到 APP 主线的 248 G）与 50 epoch
stats: dataset/shipbench/stats_kcs_fr_sweep.json
model_type: gnot
model:
  d_model: 96
  nhead: 4
  layers: 2
  mlp_ratio: 3
  n_experts: 3
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - kcs_fr031_normal_mesh
  - kcs_fr036_normal_mesh
  - kcs_fr047_normal_mesh
  - kcs_fr052_normal_mesh
  train_strides:
  - 1
  - 2
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
  val_entries:
  - kcs_fr042_normal_mesh
