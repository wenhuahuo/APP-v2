# appsolver_v2：等计算量（iso-FLOPs）对照，前向 214.3 GFLOPs、1.239 M 参数
# 主实验统一口径：自由液面 + 船体表面输入、仅流场输出、逐层 FiLM、
# lambda_hull=0.0
# 与 appsolver_v2_multihull_normal.yaml 的唯一差别是主干容量
# （锚点不动），分词/潜网格与训练协议不变
stats: dataset/shipbench/stats.json
model_type: appsolver_v2
model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  flow_size_tiers:
  - - 0.05
    - 0.02
  - - 0.2
    - 0.05
  - - null
    - 0.15
  hull_size: 0.05
  d_model: 128
  nhead: 8
  encoder_layers: 3
  decoder_layers: 3
  positional: fourier
  query_basis: siren
  fourier_features: 32
  fourier_scale: 4.0
  conditioning: film        # film | adaln | adaln_zero
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 0.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh

eval:
  strides:
  - 1
