# APP 主线（APP 分词 + 自建主干）：4 船型训练 / 2 船型验证的多船型数据集（normal 网格）
# 训练集 kcs_fr026_normal_mesh, dtc_fr022_normal_mesh, series60_fr022_normal_mesh, containership_fr022_normal_mesh
# 验证集 s175_fr029_normal_mesh, kvlcc2_fr014_normal_mesh
stats: dataset/shipbench/stats.json
model_type: appsolver_v2
model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  - hull
  flow_size_tiers:
  - - 0.05
    - 0.02
  - - 0.2
    - 0.05
  - - null
    - 0.15
  hull_size: 0.05
  d_model: 128
  nhead: 8
  encoder_layers: 3
  decoder_layers: 3
  positional: fourier
  query_basis: siren
  fourier_features: 32
  fourier_scale: 4.0
  conditioning: film        # film | adaln | adaln_zero
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  - 2
  epochs: 100
  steps_per_epoch: 48
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh
