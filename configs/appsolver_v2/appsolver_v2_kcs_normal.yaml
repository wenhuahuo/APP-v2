# APPSolver-v2 冒烟训练：KCS Fr=0.26 normal 网格条目既作训练集也作验证集
stats: dataset/shipbench/stats.json
model_type: appsolver_v2

model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  - hull
  flow_size_tiers: [[0.05, 0.02], [0.2, 0.05], [null, 0.15]]
  hull_size: 0.05
  d_model: 64
  nhead: 4
  encoder_layers: 2
  decoder_layers: 2
  positional: fourier        # fourier | rope
  query_basis: siren         # siren | fourier | linear
  fourier_features: 16
  fourier_scale: 4.0
  dropout: 0.0

train:
  device: cpu
  dataset_root: dataset/shipbench
  entries: [kcs_fr026_normal_mesh]
  train_strides: [1, 2]
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
