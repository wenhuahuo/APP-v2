# APPSolver-v1 基线（每 patch 64 点 + 可学习 patch 位置嵌入）：KCS Fr=0.26 normal 网格条目既作训练集也作验证集（1.19 M 参数）
# 基线不含 APP 的物理尺寸分词与查询解码器：整片点云直接进、同一批点直接出，
# 训练超参与 APP 加宽主干一致。
stats: dataset/stats.json
model_type: appsolver_v1
model:
  patch_size: 64
  d_model: 112
  nhead: 4
  layers: 2
  mlp_ratio: 4
  max_patches: 2048
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset
  entries: [kcs_fr026_normal_mesh]
  train_strides: [1, 2]
  epochs: 100
  steps_per_epoch: 24
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
