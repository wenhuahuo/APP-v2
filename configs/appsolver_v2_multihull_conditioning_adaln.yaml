# DiT adaLN：每个残差分支在 LayerNorm 之后调制。
# 多船型条件调制留出实验：固定 9 船型训练 / 2 船型留出（不是完整 leave-one-hull-out）
# 训练集 kcs_fr026 / dtc_fr022 / series60_fr022 / containership_fr022 / frigate_fr030 /
#        wigley_fr030 / workboat_fr030 / npl_round_bilge_fr040 / npl_round_bilge_4a_fr040
# 验证集 s175_fr029_normal_mesh, kvlcc2_fr014_normal_mesh
# dtmb5415_fr028_normal_mesh 不参与统计量、训练与验证；KCS 其它 Fr 与 sparse 不参与。
# 统计量只在上述 9 条训练条目上拟合，不复用 4 船型实验的 dataset/shipbench/stats.json。
stats: dataset/shipbench/stats_multihull_conditioning.json
model_type: appsolver_v2
model:
  flow_size_tiers:
  - - 0.05
    - 0.02
  - - 0.2
    - 0.05
  - - null
    - 0.15
  hull_size: 0.05
  d_model: 128
  nhead: 8
  encoder_layers: 3
  decoder_layers: 3
  positional: fourier
  query_basis: siren
  fourier_features: 32
  fourier_scale: 4.0
  conditioning: adaln        # none 不使用条件编码；其余为逐层条件调制
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  - frigate_fr030_normal_mesh
  - wigley_fr030_normal_mesh
  - workboat_fr030_normal_mesh
  - npl_round_bilge_fr040_normal_mesh
  - npl_round_bilge_4a_fr040_normal_mesh
  train_strides:
  - 1
  - 2
  epochs: 100
  steps_per_epoch: 48
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh
