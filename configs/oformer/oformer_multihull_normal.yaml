# OFormer（逐点线性注意力）：4 船型训练 / 2 船型验证的多船型数据集（normal 网格）
# 主实验统一口径：自由液面 + 船体表面输入、仅流场输出、逐层 FiLM、lambda_hull=0.0
stats: dataset/shipbench/stats.json
model_type: oformer
model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  conditioning: film
  d_model: 128
  nhead: 8
  encoder_layers: 2
  decoder_layers: 2
  mlp_ratio: 4
  propagator_layers: 3
  fourier_scale: 8.0
  rotary_min_freq: 0.25
  rotary_scale: 16.0
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 0.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh

eval:
  strides:
  - 1
