# APPSolver-v1：4 船型训练 / 2 船型验证的多船型数据集（normal 网格）
# 主实验统一口径：自由液面 + 船体表面输入、流场与船面双域输出、逐层 Fourier add、
# lambda_hull=1.0
stats: dataset/shipbench/stats.json
model_type: appsolver_v1
model:
  input_domains:
  - flow
  - hull
  output_domains:
  - flow
  - hull
  conditioning: fourier_add
  patch_size: 64
  d_model: 112
  nhead: 4
  layers: 2
  mlp_ratio: 4
  max_patches: 4096
  dropout: 0.0
train:
  device: cuda
  dataset_root: dataset/shipbench
  entries:
  - kcs_fr026_normal_mesh
  - dtc_fr022_normal_mesh
  - series60_fr022_normal_mesh
  - containership_fr022_normal_mesh
  train_strides:
  - 1
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_queries: 4096
  val_queries: 16384
  lambda_hull: 1.0
  seed: 0
  val_entries:
  - s175_fr029_normal_mesh
  - kvlcc2_fr014_normal_mesh

eval:
  strides:
  - 1
